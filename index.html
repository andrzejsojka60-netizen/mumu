<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>精力管理系统 — Energy Manager</title>
<meta name="description" content="基于《超级清单》的精力管理工具 — 记录、分析、恢复">
<meta name="theme-color" content="#f8f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="精力管理">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<style>
/* ========== Reset & Variables ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-root: #f8f7f4;
  --bg-card: #ffffff;
  --bg-sidebar: #fbfaf8;
  --border: #e9e5df;
  --border-light: #f0ede8;
  --text-primary: #1b1b1b;
  --text-secondary: #6b6b6b;
  --text-tertiary: #9b9b9b;
  --accent: #4a7c59;
  --accent-light: #e8f0ea;
  --accent-warm: #b8753e;
  --accent-warm-light: #fdf0e2;
  --blue: #3b6fb6;
  --blue-light: #e8f1fd;
  --purple: #7c5cbf;
  --purple-light: #f2ecfb;
  --red: #c94a4a;
  --red-light: #fdeaea;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --transition: 0.2s cubic-bezier(.4,0,.2,1);
}

html { font-size: 15px; overscroll-behavior-y: contain; }
body {
  font-family: var(--font);
  background: var(--bg-root);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  overscroll-behavior-y: contain;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ========== Sidebar ========== */
.sidebar {
  width: 220px;
  min-height: 100vh;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 1.5rem 1rem;
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 10;
}
.sidebar-logo {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: .5rem;
  margin-bottom: 2rem;
  padding: 0 .5rem;
}
.sidebar-logo .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(1.4); }
}
.nav-list { list-style: none; display: flex; flex-direction: column; gap: .25rem; }
.nav-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .6rem .75rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: .9rem;
  color: var(--text-secondary);
  transition: var(--transition);
  border: none; background: none;
  width: 100%; text-align: left;
  font-family: var(--font);
}
.nav-item:hover { background: #f0ede8; color: var(--text-primary); }
.nav-item.active { background: #ece9e2; color: var(--text-primary); font-weight: 600; }
.nav-item .icon { font-size: 1.15rem; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--accent-light);
  color: var(--accent);
  font-size: .7rem;
  font-weight: 600;
  padding: .15rem .45rem;
  border-radius: 10px;
  min-width: 1.3rem;
  text-align: center;
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--border-light);
  font-size: .78rem;
  color: var(--text-tertiary);
}
.data-info { display: flex; flex-direction: column; gap: .3rem; }

/* ========== Main ========== */
.main {
  margin-left: 220px;
  flex: 1;
  padding: 1.5rem 2rem 3rem;
  max-width: 1000px;
  width: 100%;
}

/* ========== Header ========== */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem;
}
.page-title { font-size: 1.4rem; font-weight: 700; }
.page-date { font-size: .85rem; color: var(--text-tertiary); }

/* ========== Cards ========== */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  overflow-x: auto;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem;
}
.card-title {
  font-size: .95rem; font-weight: 650;
  color: var(--text-primary);
  display: flex; align-items: center; gap: .4rem;
}
.card-subtitle { font-size: .8rem; color: var(--text-tertiary); }
.yesterday-btn {
  font-size: .7rem; padding: .15rem .5rem;
  border-radius: 10px; border: 1px solid var(--border);
  background: #fff; color: var(--accent); cursor: pointer;
  font-family: var(--font); font-weight: 400;
  transition: var(--transition);
}
.yesterday-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.yesterday-note {
  font-size: .78rem; padding: .4rem .55rem;
  margin-bottom: .5rem;
  background: #fdf6e8; border-radius: 6px;
  color: var(--text-secondary);
  white-space: pre-wrap; line-height: 1.5;
}

/* ========== Form Elements ========== */
label {
  display: block;
  font-size: .8rem;
  font-weight: 550;
  color: var(--text-secondary);
  margin-bottom: .3rem;
}
input[type="date"].date-input {
  border: 1px solid transparent;
  background: transparent;
  font-weight: 600; font-size: .95rem;
  color: var(--text-primary);
  font-family: var(--font);
  cursor: pointer; text-align: center;
  padding: .15rem .3rem; border-radius: var(--radius-sm);
  transition: var(--transition);
  width: auto;
}
input[type="date"].date-input:hover { border-color: var(--border); background: var(--bg-root); }
input[type="date"].date-input::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .4; }
input[type="date"].date-input:hover::-webkit-calendar-picker-indicator { opacity: 1; }
input[type="number"], input[type="text"], textarea, select {
  width: 100%;
  padding: .5rem .65rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: .85rem;
  font-family: var(--font);
  color: var(--text-primary);
  background: #fdfdfc;
  transition: var(--transition);
  outline: none;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
input[type="time"] {
  padding: .4rem .45rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: .82rem;
  font-family: var(--font);
  color: var(--text-primary);
  background: #fdfdfc;
  outline: none;
  width: auto;
}
input[type="time"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
textarea { resize: vertical; min-height: 3rem; }

/* ========== Record Table ========== */
.record-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.record-table th {
  text-align: left; padding: .5rem .6rem;
  font-size: .75rem; font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  background: #fdfdfc;
}
.record-table td { padding: .45rem .45rem; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
.record-table tr:last-child td { border-bottom: none; }
.record-table .time-inputs { display: flex; align-items: center; gap: .2rem; }
.record-table .time-inputs input { width: 6.5em; min-width: 90px; font-size: .8rem; font-family: var(--font); }
.record-table .time-inputs span { color: var(--text-tertiary); font-size: .75rem; }
.record-table input[type="text"],
.record-table input[type="number"] { font-size: .82rem; padding: .4rem .45rem; }

.cat-toggle {
  display: inline-flex; border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--border); font-size: .78rem;
  white-space: nowrap;
}
.cat-opt {
  padding: .35rem .6rem; cursor: pointer; transition: var(--transition);
  background: #fff; color: var(--text-secondary);
  border: none; font-family: var(--font); font-size: .78rem;
}
.cat-opt.work.active { background: var(--accent); color: #fff; font-weight: 550; }
.cat-opt.rest.active { background: var(--accent-warm); color: #fff; font-weight: 550; }
	.cat-opt.other.active { background: var(--purple); color: #fff; font-weight: 550; }
.cat-opt:not(:last-child) { border-right: 1px solid var(--border); }

.energy-num {
  font-weight: 700; font-size: .95rem; display: inline-block; min-width: 1.5em; text-align: center;
}

.btn-icon-only {
  background: none; border: none; cursor: pointer;
  font-size: 1rem; padding: .2rem .3rem; border-radius: var(--radius-sm);
  color: var(--text-tertiary); transition: var(--transition);
  line-height: 1;
}
.btn-icon-only:hover { color: var(--red); background: var(--red-light); }

/* Quick presets */
.preset-row { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .8rem; }
.preset-chip {
  padding: .25rem .55rem; font-size: .72rem; border-radius: 16px;
  border: 1px solid var(--border); background: #fff;
  cursor: pointer; transition: var(--transition);
  color: var(--text-secondary); font-family: var(--font);
  white-space: nowrap;
}
.preset-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Stat row in record table */
.record-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: .6rem;
  margin-top: .75rem;
  padding: .75rem 1rem;
  background: var(--accent-light);
  border-radius: var(--radius-md);
  font-size: .82rem;
}
.record-stats .stat-item { text-align: center; }
.record-stats .stat-item .val { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
.record-stats .stat-item .lbl { font-size: .7rem; color: var(--text-secondary); margin-top: .1rem; }
.record-stats .stat-item.warn .val { color: var(--accent-warm); }

/* ========== Buttons ========== */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .5rem 1rem;
  border-radius: var(--radius-sm);
  font-size: .83rem;
  font-weight: 550;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: var(--font);
  transition: var(--transition);
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3d6a4a; }
.btn-secondary { background: #fff; color: var(--text-primary); border-color: var(--border); }
.btn-secondary:hover { background: #f5f3f0; }
.btn-warm { background: var(--accent-warm-light); color: var(--accent-warm); }
.btn-warm:hover { background: #f8e4cf; }
.btn-sm { padding: .3rem .65rem; font-size: .75rem; }
.btn-icon { padding: .3rem .5rem; }
.btn-danger { color: var(--red); border-color: var(--red-light); background: #fff; }
.btn-danger:hover { background: var(--red-light); }
.btn-xs { padding: .2rem .45rem; font-size: .7rem; border-radius: 4px; }

/* ========== Toolbox ========== */
.tool-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: .75rem;
}
.tool-card {
  background: #fdfdfc;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 1rem 1.1rem;
  cursor: pointer;
  transition: var(--transition);
}
.tool-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.tool-name { font-weight: 600; font-size: .88rem; margin-bottom: .2rem; }
.tool-desc { font-size: .78rem; color: var(--text-tertiary); line-height: 1.5; }
.tool-category {
  display: inline-block; font-size: .68rem;
  padding: .1rem .45rem; border-radius: 10px;
  margin-bottom: .4rem;
  font-weight: 500;
}
.tool-actions { display: flex; gap: .35rem; margin-top: .5rem; }

/* ========== Charts ========== */
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
.chart-wrap { position: relative; height: 260px; }
.chart-wrap canvas { width: 100% !important; height: 100% !important; }

/* ========== Stats row ========== */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: .75rem;
  margin-bottom: 1rem;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 1rem 1.1rem;
  box-shadow: var(--shadow-sm);
}
.stat-value { font-size: 1.6rem; font-weight: 700; }
.stat-label { font-size: .75rem; color: var(--text-tertiary); margin-top: .15rem; }
.stat-card.accent { border-left: 3px solid var(--accent); }
.stat-card.warm { border-left: 3px solid var(--accent-warm); }
.stat-card.blue { border-left: 3px solid var(--blue); }
.stat-card.purple { border-left: 3px solid var(--purple); }

/* ========== Energy items (analysis panel) ========== */
.energy-item {
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .55rem .7rem;
  border-radius: var(--radius-sm);
  font-size: .82rem;
}
.energy-item + .energy-item { margin-top: .35rem; }
.energy-item.high { background: var(--accent-light); }
.energy-item.low  { background: var(--red-light); }
.ei-time {
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  font-size: .8rem;
  min-width: 100px;
}
.ei-task {
  flex: 1;
  color: var(--text-secondary);
}
.ei-level {
  font-size: .75rem;
  font-weight: 600;
  padding: .15rem .5rem;
  border-radius: 10px;
  white-space: nowrap;
}
.energy-item.high .ei-level { background: var(--accent); color: #fff; }
.energy-item.low  .ei-level { background: var(--red); color: #fff; }

@media (max-width: 768px) {
  .energy-item { padding: .5rem .6rem; font-size: .8rem; gap: .4rem; }
  .ei-time { font-size: .76rem; min-width: 90px; }
  .ei-level { font-size: .72rem; padding: .12rem .45rem; }
}

/* ========== Modal ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  width: 440px;
  max-width: 95vw;
  box-shadow: var(--shadow-lg);
}
.modal-title { font-size: 1rem; font-weight: 650; margin-bottom: 1rem; }

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%);
  background: #1b1b1b; color: #fff;
  padding: .6rem 1.2rem;
  border-radius: 20px;
  font-size: .82rem;
  z-index: 200;
  animation: toast-in .3s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ========== Update Banner ========== */
.update-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  background: var(--accent);
  color: #fff;
  padding: .7rem 1rem;
  font-size: .88rem;
  font-weight: 550;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  transform: translateY(-100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 2px 12px rgba(0,0,0,.15);
  letter-spacing: .01em;
}
.update-banner.show {
  transform: translateY(0);
}
.update-banner .ub-close {
  background: rgba(255,255,255,.2);
  border: none;
  color: #fff;
  width: 26px; height: 26px;
  border-radius: 50%;
  font-size: .9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s;
}
.update-banner .ub-close:hover { background: rgba(255,255,255,.35); }
.update-banner .ub-btn {
  background: #fff;
  color: var(--accent);
  border: none;
  padding: .35rem 1rem;
  border-radius: 14px;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity .15s;
}
.update-banner .ub-btn:active { opacity: .8; }

@media (max-width: 768px) {
  .update-banner {
    padding: .75rem .9rem;
    font-size: .85rem;
    gap: .5rem;
  }
  .update-banner .ub-btn {
    padding: .4rem .9rem;
    font-size: .8rem;
  }
}

/* ========== Empty state ========== */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-tertiary);
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: .5rem; }

/* ========== Sleep Panel ========== */
.sleep-time-row {
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
.sleep-time-block {
  display: flex; flex-direction: column; gap: .35rem;
  flex: 1; min-width: 130px;
}
.sleep-time-block label {
  font-size: .78rem; font-weight: 550; color: var(--text-secondary);
}
.sleep-time-block input[type="time"] {
  font-size: 1.3rem; font-weight: 700; font-family: var(--font);
  padding: .55rem .75rem; border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: #fafaf8;
  color: var(--text-primary);
  width: 100%;
  transition: var(--transition);
}
.sleep-time-block input[type="time"]:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.sleep-duration {
  display: flex; align-items: center; justify-content: center;
  gap: .3rem; padding: .5rem 1rem;
  background: var(--accent-light);
  border-radius: 20px;
  font-size: .85rem; font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  align-self: flex-end;
  margin-bottom: .1rem;
}
.sleep-duration .dur-num {
  font-size: 1.4rem; font-weight: 700;
}
.sleep-quality-row {
  display: flex; align-items: center; gap: .5rem;
  flex-wrap: wrap;
}
.sleep-quality-label {
  font-size: .82rem; font-weight: 550; color: var(--text-secondary);
}
.sleep-quality-opt {
  padding: .4rem .75rem;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: #fff;
  cursor: pointer;
  font-size: .8rem; font-family: var(--font);
  transition: var(--transition);
  color: var(--text-secondary);
}
.sleep-quality-opt:hover { background: #f5f2ec; }
.sleep-quality-opt.great.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sleep-quality-opt.good.active  { background: var(--blue); color: #fff; border-color: var(--blue); }
.sleep-quality-opt.ok.active    { background: var(--accent-warm); color: #fff; border-color: var(--accent-warm); }
.sleep-quality-opt.poor.active  { background: var(--red); color: #fff; border-color: var(--red); }
.sleep-quality-opt.bad.active   { background: #888; color: #fff; border-color: #888; }

.sleep-stats-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: .6rem; margin-bottom: 1rem;
}
.sleep-stat {
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius-md); padding: .8rem 1rem;
  text-align: center; box-shadow: var(--shadow-sm);
}
.sleep-stat .ss-val { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); }
.sleep-stat .ss-lbl { font-size: .72rem; color: var(--text-tertiary); margin-top: .15rem; }
.sleep-weekly-bars {
  display: flex; align-items: flex-end; gap: .35rem;
  height: 100px; padding: 0 .3rem;
}
.sleep-weekly-bar {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: .2rem;
}
.sleep-weekly-bar .bar-fill {
  width: 100%; max-width: 36px;
  border-radius: 4px 4px 0 0;
  transition: height .3s;
  min-height: 4px;
}
.sleep-weekly-bar .bar-label {
  font-size: .62rem; color: var(--text-tertiary);
  white-space: nowrap;
}

/* Utility */
.mt-1 { margin-top: .5rem; }
.mt-2 { margin-top: 1rem; }
.mb-1 { margin-bottom: .5rem; }
.hidden { display: none !important; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-sm { gap: .5rem; }

/* Global touch optimization — eliminate 300ms delay, prevent callout */
button, .btn, .nav-item, .bottom-nav-item, .preset-chip,
.level-opt, .rating-opt, .cat-opt, .habit-dot, .plan-task-check,
.plan-task-del, .btn-icon-only, .yesterday-btn, .generate-btn,
.tool-card, input[type="date"].date-input {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea, select { user-select: text; -webkit-user-select: text; }

/* Active/pressed states for tap feedback */
.btn:active, .btn-sm:active, .btn-xs:active { transform: scale(.97); }
.preset-chip:active, .level-opt:active, .rating-opt:active,
.cat-opt:active, .habit-dot:active, .plan-task-check:active,
.yesterday-btn:active, .generate-btn:active { transform: scale(.93); }
.bottom-nav-item:active { background: var(--accent-light); }
.nav-item:active { background: #e8e4dc; }

/* Habit tracker */
.habit-row {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem 0; border-bottom: 1px solid var(--border-light);
}
.habit-row:last-child { border-bottom: none; }
.habit-days {
  display: flex; gap: .2rem; margin-left: auto;
}
.habit-dot {
  width: 18px; height: 18px;
  border-radius: 4px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  font-size: .6rem;
  display: flex; align-items: center; justify-content: center;
}
.habit-dot.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.habit-dot:hover { border-color: var(--accent); }
/* Plan tasks */
.plan-task { display: flex; align-items: center; gap: .75rem; padding: .6rem .75rem; border-radius: var(--radius-sm); background: var(--bg-root); margin-bottom: .35rem; transition: var(--transition); }
.plan-task:hover { background: var(--border-light); }
.plan-task.done .plan-task-text { text-decoration: line-through; color: var(--text-tertiary); }
.plan-task-text { flex: 1; font-size: .9rem; }
.plan-task-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .7rem; flex-shrink: 0; transition: var(--transition); }
.plan-task-check.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.plan-task-del { cursor: pointer; color: var(--text-tertiary); font-size: .85rem; padding: .2rem .4rem; border-radius: var(--radius-sm); border: none; background: none; font-family: var(--font); transition: var(--transition); }
.plan-task-del:hover { color: var(--red); background: var(--red-light); }
.plan-add-row { display: flex; gap: .5rem; margin-bottom: .75rem; }
.plan-add-row input { flex: 1; }
.plan-meta { font-size: .75rem; color: var(--text-tertiary); margin-top: .5rem; }

/* Daily summary — generate + self-rating */
.summary-task-stats {
  font-size: .82rem; color: var(--text-secondary);
  padding: .4rem .55rem; margin-bottom: .5rem;
  background: #f5f2ea; border-radius: 6px;
}
.generate-btn {
  font-size: .78rem; padding: .35rem .8rem;
  border-radius: 14px; border: 1.5px dashed var(--accent);
  background: var(--accent-light); color: var(--accent);
  cursor: pointer; font-family: var(--font); font-weight: 500;
  transition: var(--transition); margin-bottom: .5rem;
}
.generate-btn:hover { background: var(--accent); color: #fff; border-style: solid; }
.rating-row { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; margin-bottom: .55rem; }
.rating-label { font-size: .75rem; color: var(--text-secondary); white-space: nowrap; }
.rating-opt {
  padding: .2rem .5rem; font-size: .7rem; border-radius: 12px;
  border: 1.5px solid var(--border); cursor: pointer;
  background: var(--bg-root); color: var(--text-secondary);
  font-family: var(--font); transition: var(--transition);
  white-space: nowrap;
}
.rating-opt:hover { border-color: var(--accent); }
.rating-opt.active { font-weight: 600; color: #fff; }
.rating-opt.great.active   { background: #2d5a3e; border-color: #2d5a3e; }
.rating-opt.good.active    { background: var(--accent); border-color: var(--accent); }
.rating-opt.ok.active      { background: var(--blue);   border-color: var(--blue); }
.rating-opt.poor.active    { background: var(--accent-warm); border-color: var(--accent-warm); }
.rating-opt.bad.active     { background: var(--red);    border-color: var(--red); }

/* ========== Energy Level Selector ========== */
.level-select { display: flex; gap: .25rem; flex-wrap: wrap; }
.level-opt {
  padding: .25rem .5rem; font-size: .72rem; border-radius: 14px;
  border: 1.5px solid var(--border); cursor: pointer;
  background: var(--bg-root); color: var(--text-secondary);
  font-family: var(--font); transition: var(--transition);
  white-space: nowrap;
}
.level-opt:hover { border-color: var(--accent); }
.level-opt.active { font-weight: 600; color: #fff; }
.level-opt.poor.active      { background: var(--red);         border-color: var(--red); }
.level-opt.below_avg.active { background: var(--accent-warm); border-color: var(--accent-warm); }
.level-opt.normal.active    { background: var(--blue);        border-color: var(--blue); }
.level-opt.good.active      { background: var(--accent);      border-color: var(--accent); }
.level-opt.great.active     { background: #2d5a3e;            border-color: #2d5a3e; }

/* ========== Improvement Method Row ========== */
.improve-row {
  margin-top: .4rem; padding: .5rem .6rem;
  background: var(--red-light); border-radius: var(--radius-sm);
  display: flex; flex-direction: column; gap: .4rem;
}
.improve-row input { font-size: .78rem; padding: .3rem .5rem; }
.improve-toggle { display: flex; gap: .5rem; align-items: center; font-size: .75rem; }
.improve-toggle button {
  padding: .2rem .6rem; border-radius: 12px; border: 1.5px solid var(--border);
  background: #fff; cursor: pointer; font-size: .72rem; font-family: var(--font);
}
.improve-toggle button.active-yes { background: var(--accent); color: #fff; border-color: var(--accent); }
.improve-toggle button.active-no  { background: var(--red); color: #fff; border-color: var(--red); }

/* ========== Install Banner ========== */
.install-banner {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 1px solid var(--border);
  padding: .8rem 1.2rem;
  padding-bottom: max(.8rem, env(safe-area-inset-bottom));
  z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
  gap: .8rem;
  box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  animation: slide-up .35s ease;
  flex-wrap: wrap;
}
@keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.install-banner-text { display: flex; flex-direction: column; gap: .1rem; }
.install-banner-text strong { font-size: .88rem; color: var(--text-primary); }
.install-banner-text span { font-size: .75rem; color: var(--text-tertiary); }
.install-banner-actions { display: flex; gap: .4rem; flex-shrink: 0; }

/* ========== MOBILE: Bottom Navigation ========== */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-top: 1px solid var(--border);
  z-index: 20;
  padding: .3rem .5rem;
  padding-bottom: max(.3rem, env(safe-area-inset-bottom));
  justify-content: space-around;
}
.bottom-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: .1rem;
  padding: .35rem .5rem;
  border: none; background: none;
  cursor: pointer;
  color: var(--text-tertiary);
  font-family: var(--font);
  transition: var(--transition);
  border-radius: var(--radius-sm);
  min-width: 56px;
  -webkit-tap-highlight-color: transparent;
}
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item:active { background: var(--accent-light); }
.bn-icon { font-size: 1.3rem; line-height: 1; }
.bn-label { font-size: .65rem; font-weight: 500; }

/* ========== MOBILE: Responsive Overrides ========== */
@media (max-width: 768px) {
  html { font-size: 16px; }
  .sidebar { display: none; }
  .bottom-nav {
    display: flex;
    box-shadow: 0 -2px 16px rgba(0,0,0,.08);
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .install-banner { bottom: 4.8rem; }
  .main {
    margin-left: 0;
    padding: 1.2rem 1rem 6.8rem;
    max-width: 100%;
  }

  /* Page header — sticky for mobile */
  .page-header {
    flex-direction: column;
    align-items: flex-start;
    gap: .7rem;
    margin-bottom: 1.2rem;
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg-root);
    padding: .3rem 0 .5rem;
  }
  .page-header > div { flex-wrap: wrap; gap: .4rem; }
  .page-title { font-size: 1.3rem; letter-spacing: -.01em; }
  .page-date { font-size: .8rem; }

  /* Stats grid */
  .stats-row { grid-template-columns: 1fr 1fr; gap: .5rem; }
  .stat-card { padding: .85rem .9rem; border-radius: var(--radius-md); }
  .stat-value { font-size: 1.35rem; }
  .stat-label { font-size: .73rem; }
  .charts-row { grid-template-columns: 1fr; gap: .8rem; }
  .chart-wrap { height: 250px; }

  /* Cards — more breathing room */
  .card {
    padding: 1rem .9rem;
    border-radius: var(--radius-md);
    margin-bottom: .85rem;
    overflow-x: auto;
    box-shadow: 0 0 0 1px rgba(0,0,0,.03), 0 1px 3px rgba(0,0,0,.04);
  }
  .card-header { margin-bottom: .85rem; }

  /* Buttons — minimum 44px touch target */
  .btn { min-height: 46px; padding: .65rem 1.3rem; font-size: .9rem; display: inline-flex; align-items: center; justify-content: center; }
  .btn-sm { min-height: 42px; padding: .55rem .9rem; font-size: .84rem; }
  .btn-xs { min-height: 38px; padding: .45rem .7rem; font-size: .78rem; }
  .btn-icon-only { min-height: 44px; min-width: 44px; padding: .45rem; font-size: 1.2rem; border-radius: 50%; }
  .btn-icon-only:hover { background: var(--red-light); }

  /* Form inputs — 16px prevents iOS auto-zoom */
  input[type="text"], input[type="number"], textarea, select {
    padding: .65rem .75rem;
    font-size: 16px;
    border-radius: var(--radius-sm);
  }
  input[type="time"] { padding: .55rem .55rem; font-size: 16px; min-height: 42px; border-radius: var(--radius-sm); }
  input[type="date"].date-input { font-size: 16px; }

  /* Category toggle — full-width on mobile */
  .cat-toggle { font-size: .8rem; border-radius: var(--radius-sm); }
  .cat-opt { padding: .5rem .7rem; font-size: .8rem; min-height: 42px; flex: 1; text-align: center; }

  /* Energy level pills */
  .level-opt { padding: .48rem .68rem; font-size: .78rem; min-height: 40px; border-radius: 14px; }

  /* Rating pills */
  .rating-opt { padding: .42rem .62rem; font-size: .78rem; min-height: 40px; border-radius: 14px; }

  /* Yesterday & generate buttons */
  .yesterday-btn { padding: .35rem .7rem; font-size: .78rem; min-height: 40px; border-radius: 12px; }
  .generate-btn { padding: .55rem 1.1rem; font-size: .86rem; }

  /* Plan task list */
  .plan-task { padding: .65rem .7rem; border-radius: var(--radius-sm); margin-bottom: .4rem; }
  .plan-task-text { font-size: .93rem; }
  .plan-task-check { width: 30px; height: 30px; font-size: .9rem; border-width: 2.5px; flex-shrink: 0; }
  .plan-task-del { padding: .4rem .55rem; font-size: 1rem; min-height: 44px; min-width: 44px; border-radius: 50%; }
  .plan-add-row { gap: .4rem; }
  .plan-add-row input { font-size: 16px; padding: .65rem .7rem; }
  .plan-add-row .btn { flex-shrink: 0; }

  /* Preset chips */
  .preset-row { gap: .35rem; }
  .preset-chip { padding: .45rem .72rem; font-size: .78rem; min-height: 40px; border-radius: 16px; }

  /* Tool grid */
  .tool-grid { grid-template-columns: 1fr; gap: .6rem; }
  .tool-card { padding: 1rem 1.05rem; }
  .tool-name { font-size: .92rem; }
  .tool-desc { font-size: .8rem; }
  .tool-category { font-size: .7rem; }

  /* Habit tracker */
  .habit-dot { width: 28px; height: 28px; font-size: .8rem; border-radius: 5px; }
  .habit-row { flex-wrap: wrap; gap: .35rem; padding: .55rem 0; }
  .habit-row > span:first-child { font-size: .88rem; }

  /* Modal */
  .modal { width: 92vw; padding: 1.3rem; border-radius: var(--radius-lg); }
  .modal-title { font-size: 1.05rem; }

  /* Toast — above bottom nav */
  .toast { bottom: 5.8rem; font-size: .82rem; padding: .6rem 1.2rem; border-radius: 20px; }

  /* Record stats */
  .record-stats { grid-template-columns: repeat(2, 1fr); font-size: .8rem; gap: .5rem; padding: .8rem .9rem; }
  .record-stats .stat-item .val { font-size: 1.15rem; }
  .record-stats .stat-item .lbl { font-size: .68rem; }

  /* ===== Record table → mobile cards ===== */
  .record-table { font-size: .84rem; }
  .record-table thead { display: none; }
  .record-table, .record-table tbody, .record-table tr, .record-table td {
    display: block;
  }
  .record-table tr {
    background: #fdfdfc;
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: .8rem;
    padding: .85rem .75rem .75rem;
    position: relative;
    box-shadow: 0 2px 6px rgba(0,0,0,.05);
  }
  .record-table tr:last-child { margin-bottom: .3rem; }
  .record-table td {
    border: none; padding: .38rem 0;
    display: flex; align-items: center; gap: .5rem;
    overflow: visible;
  }
  .record-table td::before {
    content: attr(data-label);
    font-size: .75rem; font-weight: 600; color: var(--text-secondary);
    min-width: 5.5em; flex-shrink: 0;
    opacity: .85;
  }
  /* Delete button — absolute top-right, round */
  .record-table td:last-child {
    position: absolute; top: .45rem; right: .45rem;
    padding: 0; min-width: auto;
  }
  .record-table td:last-child::before { display: none; }
  .record-table td:last-child .btn-icon-only {
    min-height: 36px; min-width: 36px;
    font-size: 1rem; border-radius: 50%;
    background: rgba(0,0,0,.03);
  }
  .record-table .time-inputs input { flex: 1; min-width: 85px; font-size: .84rem; }
  .record-table .time-inputs { flex: 1; }
  .record-table input[type="text"],
  .record-table input[type="number"] { font-size: .84rem; padding: .45rem .5rem; }

  /* Improvement row — clearer visual */
  .improve-row {
    margin-top: .35rem; padding: .5rem .6rem;
    width: 100%; border-radius: var(--radius-sm);
    background: #fef5f5;
    border: 1px solid #fde2e2;
  }
  .improve-row input { font-size: .84rem; padding: .4rem .55rem; }
  .improve-toggle { gap: .4rem; }
  .improve-toggle button { padding: .35rem .75rem; font-size: .78rem; min-height: 38px; border-radius: 12px; }
  .record-table td .level-select { flex-wrap: wrap; gap: .3rem; }

  /* Energy num */
  .energy-num { font-size: .92rem; }

  /* Bottom nav — native-app feel */
  .bottom-nav-item {
    min-height: 54px; padding: .35rem .45rem;
    min-width: 60px; border-radius: var(--radius-sm);
    transition: var(--transition);
  }
  .bn-icon { font-size: 1.5rem; line-height: 1.2; }
  .bn-label { font-size: .73rem; font-weight: 500; letter-spacing: .02em; }

  /* Summary section */
  .summary-task-stats { font-size: .86rem; padding: .5rem .6rem; border-radius: 8px; }
  .rating-label { font-size: .8rem; }
  .rating-opt { min-height: 40px; }

  /* Misc */
  .plan-meta { font-size: .78rem; }
  .empty-state { padding: 2.5rem 1rem; }
  .empty-state .icon { font-size: 2.8rem; }
  .flex-between { gap: .4rem; }

  /* Sleep */
  .sleep-time-row { flex-direction: column; align-items: stretch; gap: .6rem; }
  .sleep-duration { align-self: center; }
  .sleep-stats-row { grid-template-columns: repeat(3, 1fr); }
  .sleep-quality-row { gap: .35rem; }
  .sleep-quality-opt { padding: .35rem .6rem; font-size: .76rem; min-height: 38px; }
  .sleep-weekly-bars { height: 85px; }
}

@media (max-width: 400px) {
  .main { padding: .8rem .7rem 6.5rem; }
  .stats-row { grid-template-columns: 1fr 1fr; gap: .4rem; }
  .stat-card { padding: .7rem .75rem; }
  .stat-value { font-size: 1.15rem; }
  .stat-label { font-size: .7rem; }
  .bottom-nav-item { padding: .25rem .3rem; min-width: 48px; min-height: 50px; }

  .bn-label { font-size: .66rem; }
  .page-title { font-size: 1.15rem; }
  .page-header { gap: .45rem; margin-bottom: 1rem; }
  .card { padding: .8rem .75rem; margin-bottom: .7rem; }
  .card-header { margin-bottom: .7rem; }
  .btn { min-height: 42px; padding: .55rem 1.1rem; font-size: .86rem; }
  .btn-sm { min-height: 40px; padding: .5rem .8rem; font-size: .8rem; }
  .btn-icon-only { min-height: 40px; min-width: 40px; }

  .record-table input[type="text"],
  .record-table input[type="number"] { font-size: .8rem; padding: .4rem .45rem; }
  .level-opt { padding: .4rem .58rem; font-size: .74rem; min-height: 36px; }
  .rating-opt { padding: .34rem .5rem; font-size: .74rem; min-height: 36px; }
  .plan-task { padding: .55rem .6rem; }
  .plan-task-text { font-size: .88rem; }
  .plan-task-check { width: 28px; height: 28px; }
  .plan-task-del { min-height: 40px; min-width: 40px; }

  .tool-card { padding: .85rem .9rem; }
  .habit-dot { width: 26px; height: 26px; font-size: .75rem; }
  .preset-chip { padding: .4rem .6rem; font-size: .74rem; min-height: 36px; }

/* ========== Weekly Summary ========== */
.week-nav-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.2rem;
}
.week-range-title {
  font-size: 1.2rem; font-weight: 700;
  color: var(--text-primary);
}
.week-range-sub {
  font-size: .8rem; color: var(--text-tertiary);
  margin-top: .15rem;
}
.week-day-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: .4rem;
}
.week-day-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: .6rem .5rem;
  text-align: center;
  box-shadow: var(--shadow-sm);
  font-size: .78rem;
}
.week-day-card.today { border-color: var(--accent); border-width: 2px; }
.week-day-card .wd-day {
  font-weight: 700; font-size: .72rem;
  color: var(--text-secondary);
  margin-bottom: .15rem;
}
.week-day-card.today .wd-day { color: var(--accent); }
.week-day-card .wd-date {
  font-size: .68rem; color: var(--text-tertiary);
  margin-bottom: .35rem;
}
.week-day-card .wd-metric {
  font-size: .7rem; color: var(--text-secondary);
  margin: .15rem 0; line-height: 1.4;
}
.week-day-card .wd-metric strong { color: var(--text-primary); }
.week-day-card .wd-energy {
  display: inline-block;
  width: 8px; height: 8px; border-radius: 50%;
  margin-right: 2px; vertical-align: middle;
}
.wd-no-data { font-size: .68rem; color: var(--text-tertiary); padding: .5rem 0; }

/* Weekly progress bar */
.week-progress-bg {
  height: 4px; background: var(--border-light);
  border-radius: 2px; margin: .2rem 0;
  overflow: hidden;
}
.week-progress-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px; transition: width .4s;
}

/* Weekly detail rows */
.week-detail-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
.week-detail-table th {
  text-align: left; padding: .45rem .55rem;
  font-size: .73rem; font-weight: 600;
  color: var(--text-secondary);

<script>
/* ================================================================
   ENERGY MANAGEMENT SYSTEM v2.0
   Based on《超级清单：精力管理实用技巧、表格与自我训练》
   每日工作精力状况统计表 — 可自由设置时间段
   ================================================================ */

// ==================== DATA LAYER ====================
const STORAGE_KEY = 'energyManager_v2';

// Time period presets (editable by user)
const TIME_PRESETS = [
  { label: '早晨 6-9', start: '06:00', end: '09:00' },
  { label: '上午 9-12', start: '09:00', end: '12:00' },
  { label: '下午 12-18', start: '12:00', end: '18:00' },
  { label: '晚上 18-22', start: '18:00', end: '22:00' },
];

// Energy level system — replaces 1-10 numeric score
const ENERGY_LEVELS = [
  { key: 'poor',      label: '差',   color: 'var(--red)',         num: 1 },
  { key: 'below_avg', label: '较差', color: 'var(--accent-warm)', num: 3 },
  { key: 'normal',    label: '正常', color: 'var(--blue)',        num: 6 },
  { key: 'good',      label: '良好', color: 'var(--accent)',      num: 8 },
  { key: 'great',     label: '舒服', color: 'var(--accent)',      num: 10 },
];

function levelToNum(label) { return ENERGY_LEVELS.find(l => l.label === label)?.num ?? 6; }
function numToLevel(num) {
  if (num <= 2) return '差';
  if (num <= 4) return '较差';
  if (num <= 6) return '正常';
  if (num <= 8) return '良好';
  return '舒服';
}

const SELF_RATINGS = [
  { key: 'great', label: '优秀', color: '#2d5a3e' },
  { key: 'good',  label: '良好', color: 'var(--accent)' },
  { key: 'ok',    label: '中等', color: 'var(--blue)' },
  { key: 'poor',  label: '较差', color: 'var(--accent-warm)' },
  { key: 'bad',   label: '差',   color: 'var(--red)' },
];

const SLEEP_QUALITIES = [
  { key: 'great', label: '很好', color: 'var(--accent)' },
  { key: 'good',  label: '良好', color: 'var(--blue)' },
  { key: 'ok',    label: '一般', color: 'var(--accent-warm)' },
  { key: 'poor',  label: '较差', color: 'var(--red)' },
  { key: 'bad',   label: '很差', color: '#888' },
];

const DEFAULT_EMOTIONS = ['专注','高效','平静','疲惫','焦虑','亢奋','低落','放松','紧张','满足'];
const DEFAULT_TOOLS = [
  { id: 't1', name: '冥想呼吸法', category: '放松', desc: '闭眼深呼吸5分钟，专注一呼一吸，清空杂念。书中第五章推荐。' },
  { id: 't2', name: '番茄工作法', category: '专注', desc: '25分钟专注+5分钟休息，每4个番茄钟休息15-30分钟。书中第六章推荐。' },
  { id: 't3', name: '莫法特休息法', category: '切换', desc: '在不同类型任务间切换（脑力→体力→创意），避免单一疲劳。书中第八章推荐。' },
  { id: 't4', name: 'ICS减压法', category: '放松', desc: '识别(Identify)→澄清(Clarify)→解决(Solve)，三步处理压力源。书中第五章推荐。' },
  { id: 't5', name: '彭尼贝克写作法', category: '情绪', desc: '连续4天、每天15分钟写出最深层的想法和感受。书中第五章推荐。' },
  { id: 't6', name: '短暂小憩', category: '恢复', desc: '10-20分钟短暂闭眼休息（不超过30分钟），快速恢复精力。书中第七章推荐。' },
  { id: 't7', name: '散步/运动', category: '恢复', desc: '15-30分钟户外散步或轻度运动，转换环境激活身体。书中第四章/第七章推荐。' },
  { id: 't8', name: '正念练习', category: '放松', desc: '将注意力放在当下，不评判地观察自己的感受。书中第五章/第八章推荐。' },
];

function generateId() { return 'e' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

function formatDuration(minutes) {
  if (!minutes || minutes <= 0) return '0分钟';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0 && m > 0) return h + '小时' + m + '分钟';
  if (h > 0) return h + '小时';
  return m + '分钟';
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      return migrateData(data);
    }
  } catch(e) { /* corrupted */ }
  // Try legacy key
  try {
    const legacy = localStorage.getItem('energyManager');
    if (legacy) {
      const data = JSON.parse(legacy);
      return migrateData(data);
    }
  } catch(e) { /* */ }
  return getDefaultData();
}

function migrateData(data) {
  // Ensure new data model
  if (!data.records) data.records = {};
  if (!data.tools) data.tools = [...DEFAULT_TOOLS];
  if (!data.customEmotions) data.customEmotions = [];
  if (!data.habitLog) data.habitLog = {};
  if (!data.timePresets) data.timePresets = [...TIME_PRESETS];
  if (!data.plans) data.plans = {};
  if (!data.sleepLog) data.sleepLog = {};
  if (!data.weeklyNotes) data.weeklyNotes = {};

  // Migrate old period-based records to new entry-based format
  const migrated = {};
  for (const [date, rec] of Object.entries(data.records)) {
    if (!rec || typeof rec !== 'object') continue;
    // Already has entries array? Use as-is
    if (Array.isArray(rec.entries)) {
      migrated[date] = rec;
      continue;
    }
    // Old format: { periods: { morning: {...}, ... }, note, interference, tasks }
    if (rec.periods && typeof rec.periods === 'object') {
      const entries = [];
      const periodMap = {
        morning:   { label: '早晨', start: '06:00', end: '09:00' },
        forenoon:  { label: '上午', start: '09:00', end: '12:00' },
        afternoon: { label: '下午', start: '12:00', end: '18:00' },
        evening:   { label: '晚上', start: '18:00', end: '22:00' },
      };
      for (const [pid, pd] of Object.entries(rec.periods)) {
        if (!pd || typeof pd !== 'object') continue;
        const info = periodMap[pid] || { label: pid, start: '', end: '' };
        entries.push({
          id: generateId(),
          startTime: info.start,
          endTime: info.end,
          task: (pd.tasks || []).join('；') || (pd.emotion || ''),
          category: '工作',
          duration: 0,
          energyLevel: numToLevel(pd.score || 5),
        });
      }
      migrated[date] = { entries, note: rec.note || '' };
    } else {
      migrated[date] = { entries: [], note: rec.note || '' };
    }
  }
  data.records = migrated;
  if (!data.timePresets) data.timePresets = [...TIME_PRESETS];
  if (!data.plans) data.plans = {};
  if (!data.sleepLog) data.sleepLog = {};
  if (!data.weeklyNotes) data.weeklyNotes = {};

  // Migrate old numeric energy → new text-based energyLevel
  for (const [date, rec] of Object.entries(data.records)) {
    if (rec.entries) {
      rec.entries.forEach(e => {
        if (e.energy !== undefined && !e.energyLevel) {
          e.energyLevel = numToLevel(e.energy);
          delete e.energy;
        }
        if (!e.energyLevel) e.energyLevel = '正常';
        if (e.improvementMethod === undefined) e.improvementMethod = '';
        if (e.improvementUseful === undefined) e.improvementUseful = null;
      });
    }
  }

  return data;
}

function getDefaultData() {
  return {
    records: {},
    plans: {},
    tools: [...DEFAULT_TOOLS],
    customEmotions: [],
    habitLog: {},
    timePresets: [...TIME_PRESETS],
    sleepLog: {},
    weeklyNotes: {},
  };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// 防抖保存 — 300ms 内连续调用只写一次 localStorage
let _saveTimer = null;
function scheduleSave(data) {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    saveData(data);
    _saveTimer = null;
  }, 300);
}
function flushSave() {
  if (_saveTimer) {
    clearTimeout(_saveTimer);
    _saveTimer = null;
    saveData(APP_DATA);
  }
}

let APP_DATA = loadData();

function getAllEmotions() {
  return [...DEFAULT_EMOTIONS, ...APP_DATA.customEmotions];
}

function today() { return new Date().toISOString().slice(0,10); }

function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  const w = ['日','一','二','三','四','五','六'][dt.getDay()];
  return `${d.slice(5)} (周${w})`;
}

function ensureRecord(date) {
  if (!APP_DATA.records[date]) {
    APP_DATA.records[date] = { entries: [], note: '' };
  }
  if (!APP_DATA.records[date].entries) {
    APP_DATA.records[date].entries = [];
  }
  return APP_DATA.records[date];
}

// ==================== UI RENDERING ====================
let currentPanel = 'plan';
let currentDate = today();

const $main = document.getElementById('mainContent');
const $toast = document.getElementById('toast');

function showToast(msg) {
  $toast.textContent = msg;
  $toast.classList.remove('hidden');
  setTimeout(() => $toast.classList.add('hidden'), 1800);
}

function switchPanel(panel) {
  flushSave(); // 切换面板前确保数据已保存
  currentPanel = panel;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const sb = document.querySelector(`.nav-item[data-panel="${panel}"]`);
  if (sb) sb.classList.add('active');
  document.querySelectorAll('.bottom-nav-item').forEach(b => b.classList.remove('active'));
  const bb = document.querySelector(`.bottom-nav-item[data-panel="${panel}"]`);
  if (bb) bb.classList.add('active');
  render();
}

function updateSidebarStats() {
  const dates = Object.keys(APP_DATA.records).filter(d => {
    const rec = APP_DATA.records[d];
    return rec && Array.isArray(rec.entries) && rec.entries.length > 0;
  });
  document.getElementById('dataDays').textContent = `📅 已记录 ${dates.length} 天`;
  let total = 0;
  dates.forEach(d => { total += APP_DATA.records[d].entries.length; });
  document.getElementById('dataRecords').textContent = `📝 共 ${total} 条记录`;
}

// ==================== DATA EXPORT / IMPORT ====================
function exportData() {
  const blob = new Blob([JSON.stringify(APP_DATA, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `energy-backup-${today()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records) throw new Error('格式不正确');
      const cnt = Object.keys(data.records).length;
      if (!confirm(`即将导入数据：${cnt} 天记录。\n当前数据将被覆盖，确定继续？`)) return;
      APP_DATA = migrateData(data);
      saveData(APP_DATA);
      showToast('📥 数据已导入');
      setTimeout(() => { currentDate = today(); render(); }, 300);
    } catch(err) {
      showToast('❌ 文件格式不正确');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function resetData() {
  if (!confirm('⚠️ 确定要清除全部数据吗？\n此操作不可恢复！建议先导出备份。')) return;
  if (!confirm('再次确认：清除所有精力记录、自定义工具和打卡数据？')) return;
  APP_DATA = getDefaultData();
  saveData(APP_DATA);
  currentDate = today();
  render();
  showToast('🗑️ 数据已清除');
}

// ==================== SHARED: DATE NAVIGATION ====================
function dateNavHtml(title) {
  return `<div class="page-header">
    <h1 class="page-title">${title}</h1>
    <div style="display:flex;align-items:center;gap:.5rem">
      <button class="btn btn-secondary btn-sm" onclick="changeDate(-1)">◀</button>
      <input type="date" class="date-input" value="${currentDate}" onchange="jumpToDate(this.value)" title="点击选择日期">
      <button class="btn btn-secondary btn-sm" onclick="changeDate(1)">▶</button>
      <button class="btn btn-secondary btn-sm" onclick="goToToday()">今天</button>
    </div>
  </div>`;
}

// ==================== PANEL: RECORD ====================
function renderRecord() {
  const rec = ensureRecord(currentDate);
  const entries = rec.entries || [];

  // Table rows
  const rowsHtml = entries.map((entry, idx) => {
    const currentLevel = entry.energyLevel || '正常';
    const isRest = entry.category === '休息';
    return `
    <tr data-entry-id="${entry.id}">
      <td data-label="时间段">
        <div class="time-inputs">
          <input type="time" value="${entry.startTime || ''}" onchange="updateEntry('${entry.id}','startTime',this.value)" title="开始时间">
          <span>—</span>
          <input type="time" value="${entry.endTime || ''}" onchange="updateEntry('${entry.id}','endTime',this.value)" title="结束时间">
        </div>
      </td>
      <td data-label="${isRest ? '休息方式' : '事项'}">
        <input type="text" value="${escHtml(entry.task || '')}" placeholder="${isRest ? '如：冥想、散步、小憩…' : '如：写报告、开会…'}" onchange="updateEntry('${entry.id}','task',this.value)">
      </td>
      <td data-label="分类">
        <div class="cat-toggle">
          <button class="cat-opt work${entry.category === '工作' ? ' active' : ''}" onclick="updateEntry('${entry.id}','category','工作')">工作</button>
          <button class="cat-opt rest${entry.category === '休息' ? ' active' : ''}" onclick="updateEntry('${entry.id}','category','休息')">休息</button>
          <button class="cat-opt other${entry.category === '其它' ? ' active' : ''}" onclick="updateEntry('${entry.id}','category','其它')">其它</button>
        </div>
      </td>
      <td data-label="时长">
        <input type="number" value="${entry.duration || ''}" placeholder="分钟" min="0" max="480" style="width:5em" title="输入分钟数" onchange="updateEntry('${entry.id}','duration',parseInt(this.value)||0)">
      </td>
      ${isRest ? `
      <td data-label="有效性">
        <div class="improve-toggle" style="margin:0">
          <button class="${entry.improvementUseful===true?'active-yes':''}" onclick="updateEntry('${entry.id}','improvementUseful',${entry.improvementUseful===true?null:true});render();">👍 有效</button>
          <button class="${entry.improvementUseful===false?'active-no':''}" onclick="updateEntry('${entry.id}','improvementUseful',${entry.improvementUseful===false?null:false});render();">👎 无效</button>
        </div>
      </td>
      ` : `
      <td data-label="精力评估">
        <div class="level-select">
          ${ENERGY_LEVELS.map(l => `
            <button class="level-opt ${l.key}${currentLevel===l.label?' active':''}"
                    onclick="updateEnergyLevel('${entry.id}','${l.label}')"
                    title="${l.label}">${l.label}</button>
          `).join('')}
        </div>
      </td>
      `}
      <td data-label="操作" style="text-align:center">
        <button class="btn-icon-only" onclick="deleteEntry('${entry.id}')" title="删除此行">✕</button>
      </td>
    </tr>`;
  }).join('');

  // Calculate statistics
  const stats = calcDayStats(entries);

  const html = `
  ${dateNavHtml('📝 每日工作精力状况统计表')}

  <div class="card">
    <div class="card-header">
      <span class="card-title">⏱️ 精力记录表</span>
    </div>

    <div style="overflow-x:auto">
    <table class="record-table">
      <thead>
        <tr>
          <th style="width:150px">时间段</th>
          <th>事项</th>
          <th style="width:80px">分类</th>

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function calcDayStats(entries) {
  let workMin = 0, restMin = 0;
  const goodPeriods = [], poorPeriods = [];
  entries.forEach(e => {
    const dur = e.duration || 0;
    if (e.category === '休息') restMin += dur;
    else if (e.category === '工作') workMin += dur;
    const label = e.startTime && e.endTime ? `${e.startTime}-${e.endTime}` : (e.task || '未命名');
    const level = e.energyLevel || '正常';
    if (level === '良好' || level === '舒服') goodPeriods.push(label);
    if (level === '差' || level === '较差') poorPeriods.push(label);
  });
  const totalMin = workMin + restMin;
  return {
    workMin,
    restMin,
    totalMin,
    workPct: totalMin > 0 ? Math.round(workMin / totalMin * 100) : 0,
    restPct: totalMin > 0 ? Math.round(restMin / totalMin * 100) : 0,
    goodPeriods: goodPeriods.length ? goodPeriods.join('、') : '',
    poorPeriods: poorPeriods.length ? poorPeriods.join('、') : '',
  };
}

function calcDuration(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return mins;
}

function addEmptyEntry() {
	  const rec = ensureRecord(currentDate);
	  // 从上一项的结束时间继续，避免重复拉动时间选择器
	  let start = '09:00';
	  let end = '10:00';
	  if (rec.entries.length > 0) {
	    const last = rec.entries[rec.entries.length - 1];
	    if (last.endTime) {
	      start = last.endTime;
	      end = addMinutes(start, 60);
	    }
	  }
	  rec.entries.push({
	    id: generateId(),
	    startTime: start,
	    endTime: end,
	    task: '',
	    category: '工作',
	    duration: calcDuration(start, end),
	    energyLevel: '正常', improvementMethod: '', improvementUseful: null,
	  });
	  scheduleSave(APP_DATA);
	  render();
	}

	function addMinutes(time, mins) {
	  if (!time) return '10:00';
	  const [h, m] = time.split(':').map(Number);
	  const total = h * 60 + m + mins;
	  const nh = Math.floor(total / 60) % 24;
	  const nm = total % 60;
	  return String(nh).padStart(2, '0') + ':' + String(nm).padStart(2, '0');
	}

// 按需加载 Chart.js（仅分析面板需要）
let _chartJsPromise = null;
function ensureChartJs(callback) {
  if (window.Chart) { callback(); return; }
  if (!_chartJsPromise) {
    _chartJsPromise = new Promise((resolve) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';
      script.onload = () => resolve();
      script.onerror = () => { console.warn('[Chart.js] Failed to load'); resolve(); };
      document.head.appendChild(script);
    });
  }
  _chartJsPromise.then(callback);
}

function renderTrendChart(labels, data) {
  const ctx = document.getElementById('trendChart');

  new Chart(ctx, {
    type: 'line',

        label: '日均精力评分',
        data,
        borderColor: '#4a7c59',

        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#4a7c59',
        spanGaps: false,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } } },

function toggleHabit(date, toolId) {
  if (!APP_DATA.habitLog[date]) APP_DATA.habitLog[date] = {};
  if (APP_DATA.habitLog[date][toolId]) {
    delete APP_DATA.habitLog[date][toolId];
  } else {
    APP_DATA.habitLog[date][toolId] = true;
  }
  scheduleSave(APP_DATA);

  // Inline DOM update — toggle dot and update streak
  const dot = document.querySelector(`[onclick*="toggleHabit('${date}','${toolId}')"]`);
  if (dot) {
    const done = APP_DATA.habitLog[date] && APP_DATA.habitLog[date][toolId];
    if (done) { dot.classList.add('done'); dot.textContent = '✓'; }
    else { dot.classList.remove('done'); dot.textContent = ''; }
    // Update streak counter in the same row
    const daysDiv = dot.closest('.habit-days');
    if (daysDiv) {
      const allDots = daysDiv.querySelectorAll('.habit-dot');
      const streak = Array.from(allDots).filter(d => d.classList.contains('done')).length;
      const streakSpan = daysDiv.parentElement.querySelector('span[style*="font-size:.72rem"]');
      if (streakSpan) streakSpan.textContent = `近7天 ${streak}/7`;
    }
  }
}

// ==================== PANEL: SLEEP ====================
function ensureSleep(date) {
  if (!APP_DATA.sleepLog[date]) {
    APP_DATA.sleepLog[date] = {
      sleepTime: '',
      wakeTime: '',
      quality: '',
      note: '',
    };
  }
  return APP_DATA.sleepLog[date];
}

function calcSleepDuration(sleepTime, wakeTime) {
  if (!sleepTime || !wakeTime) return null;
  const [sh, sm] = sleepTime.split(':').map(Number);
  const [wh, wm] = wakeTime.split(':').map(Number);
  let totalMin = (wh * 60 + wm) - (sh * 60 + sm);
  if (totalMin < 0) totalMin += 24 * 60; // spans midnight
  if (totalMin === 0) return null;
  return { hours: Math.floor(totalMin / 60), mins: totalMin % 60, totalMin };
}

function saveSleepField(field, value) {
  const sl = ensureSleep(currentDate);
  sl[field] = value;
  scheduleSave(APP_DATA);

      $dur.style.display = '';

    }
  }
}

// ==================== WEEKLY SUMMARY ====================
function getWeekRange(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay(); // 0=Sun
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  const days = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    days.push(dd.toISOString().slice(0, 10));
  }
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  return {
    monday: mon.toISOString().slice(0, 10),
    sunday: sun.toISOString().slice(0, 10),
    days,
    key: mon.toISOString().slice(0, 10),
  };
}

function formatWeekLabel(monday, sunday) {
  const fmt = (ds) => {
    const d = new Date(ds + 'T00:00:00');
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  };
  return fmt(monday) + ' — ' + fmt(sunday);
}

function changeWeek(delta) {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + delta * 7);
  currentDate = d.toISOString().slice(0, 10);
  render();
}

function goToThisWeek() {
  currentDate = today();
  render();
}

            scales: { y: { min: 0, max: 10, ticks: { stepSize: 2 } } },
          },
        });
      }

      // Duration chart (work + sleep bars)
      const dCtx = document.getElementById('weekDurationChart');
      if (dCtx) {
        new Chart(dCtx, {
          type: 'bar',
          data: {
            labels: chartLabels,
            datasets: [
              {
                label: '工作时长(h)',
                data: workData,
                backgroundColor: 'rgba(74,124,89,0.6)',
                borderColor: '#4a7c59',
                borderWidth: 1,
                borderRadius: 4,
              },
              {
                label: '睡眠时长(h)',
                data: sleepData,
                backgroundColor: 'rgba(59,111,182,0.5)',
                borderColor: '#3b6fb6',
                borderWidth: 1,
                borderRadius: 4,
              },
            ],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15, font: { size: 11 } } } },
            scales: { y: { beginAtZero: true, title: { display: true, text: '小时', font: { size: 10 } } } },
          },
        });
      }
    });
  }, 50);
}

// ==================== MAIN RENDER ====================
function render() {
  switch(currentPanel) {
    case 'plan': renderPlan(); break;
    case 'record': renderRecord(); break;
    case 'analysis': renderAnalysis(); break;
    case 'toolbox': renderToolbox(); break;
    case 'sleep': renderSleep(); break;
    case 'weekly': renderWeekly(); break;
    default: renderPlan();
  }
  updateSidebarStats();
}

// ==================== PWA: Install ====================
let deferredPrompt = null;
const $installBanner = document.getElementById('installBanner');
const $installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!sessionStorage.getItem('installDismissed')) {
    $installBanner.classList.remove('hidden');
  }
});

$installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('[PWA] Install:', outcome);
  deferredPrompt = null;
  $installBanner.classList.add('hidden');
});

function dismissInstall() {
  $installBanner.classList.add('hidden');
  sessionStorage.setItem('installDismissed', '1');
}

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App installed successfully');
  $installBanner.classList.add('hidden');
  deferredPrompt = null;
  showToast('✅ 安装成功！');
});

// ==================== PWA: Service Worker ====================
let swRegistration = null;
let waitingWorker = null;
const $updateBanner = document.getElementById('updateBanner');
const $ubRefresh = document.getElementById('ubRefresh');
const $ubClose = document.getElementById('ubClose');

// Show update banner (instead of toast)
function showUpdateBanner() {
  $updateBanner.classList.add('show');
}

// Dismiss update banner for this session
$ubClose.addEventListener('click', () => {
  $updateBanner.classList.remove('show');
  sessionStorage.setItem('updateDismissed', '1');
});

// Refresh to apply new version
$ubRefresh.addEventListener('click', () => {
  if (waitingWorker) {
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  }
  window.location.reload();
});

// Listen for SW controller change (new SW took over after skipWaiting)
navigator.serviceWorker.addEventListener('controllerchange', () => {
  console.log('[SW] Controller changed — reloading');
  window.location.reload();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      swRegistration = reg;
      console.log('[SW] Registered:', reg.scope);

      // Check if there's already a waiting worker
      if (reg.waiting) {
        waitingWorker = reg.waiting;
        if (!sessionStorage.getItem('updateDismissed')) {
          showUpdateBanner();
        }
      }

      // Listen for new worker found
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('[SW] New version available');
            waitingWorker = newWorker;
            if (!sessionStorage.getItem('updateDismissed')) {
              showUpdateBanner();
            }
          }
        });
      });
    }).catch((err) => {
      console.warn('[SW] Registration failed:', err);
    });
  });

  // Periodic update check (every 30 minutes)
  setInterval(() => {
    if (swRegistration) {
      swRegistration.update().catch(() => {});
    }
  }, 30 * 60 * 1000);

  // Also check when page becomes visible again
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && swRegistration) {
      swRegistration.update().catch(() => {});
    }
  });
}

// Manual update check (exposed globally for settings panel)
function checkForUpdates() {
  if (!swRegistration) {
    showToast('⚠️ 离线模式不支持更新');
    return;
  }
  showToast('🔍 正在检查更新…');
  swRegistration.update().then(() => {
    if (!waitingWorker && !swRegistration.waiting) {
      showToast('✅ 已是最新版本');
    }
  }).catch(() => {
    showToast('⚠️ 检查更新失败，请检查网络');
  });
}

// ==================== INIT ====================
// 页面关闭/隐藏时确保数据已保存
window.addEventListener('beforeunload', () => flushSave());
window.addEventListener('pagehide', () => flushSave());

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
  });
  document.querySelectorAll('.bottom-nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.dataset.panel));
  });
  render();
  updateSidebarStats();
});
</script>
